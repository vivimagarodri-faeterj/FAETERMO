<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Faetermo</title>
  <style>
    :root{
      --paper:#eef1f5;
      --ink:#0c1420;
      --muted:#4a5568;
      --panel:#f7f9fc;
      --empty:#ffffff;
      --filled:#dbe6f5;
      --absent:#3a3a3a;
      --present:#f5a623;
      --correct:#1e8a4c;
      --danger:#3a4a63;
      --key:#ffffff;
      --accent:#1e5aa8;
      --tile:clamp(30px,8.4vw,54px);
      --gap:clamp(3px,1vw,7px);
      --border:3px;
      --shadow:4px 4px 0 var(--ink);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:Arial Black,Impact,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow-x:hidden}
    body{display:flex;justify-content:center;touch-action:manipulation}
    .app{width:min(1180px,100%);min-height:100svh;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom));gap:8px}
    header{display:grid;grid-template-columns:1fr auto;align-items:center;border:var(--border) solid var(--ink);background:var(--panel);box-shadow:var(--shadow);padding:8px;gap:8px}
    header>div:first-child{display:none}
    h1{grid-column:1;margin:0;font-size:clamp(30px,9vw,54px);letter-spacing:-.05em;font-weight:1000;text-transform:uppercase;line-height:.9;text-shadow:2px 2px 0 #9db8dc}
    .top-actions{justify-self:end;display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
    button,select{appearance:none;border:var(--border) solid var(--ink);border-radius:0;background:var(--panel);color:var(--ink);font-weight:1000;padding:9px 10px;cursor:pointer;font-size:13px;box-shadow:3px 3px 0 var(--ink);text-transform:uppercase;min-height:40px}
    button:active,select:active,.key:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
    .primary{background:var(--accent);color:#fff}.danger{background:var(--danger);color:#fff}
    main{display:flex;flex-direction:column;gap:8px;align-items:center;flex:1;justify-content:space-between;min-height:0}
    .status{width:100%;min-height:28px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink);font-weight:1000;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:13px;padding:3px 8px;border:2px solid var(--ink);background:#c4d5ec}
    .boards-wrap{width:100%;display:grid;gap:8px;align-items:start;justify-content:center;overflow:visible}
    .boards-wrap.mode-1{grid-template-columns:min-content}.boards-wrap.mode-2{grid-template-columns:repeat(2,min-content)}.boards-wrap.mode-4{grid-template-columns:repeat(4,min-content)}
    .board-card{background:var(--panel);border:var(--border) solid var(--ink);border-radius:0;padding:7px;box-shadow:var(--shadow)}
    .board-title{height:17px;text-align:left;color:var(--ink);font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:1000;line-height:1}
    .board{display:grid;grid-template-rows:repeat(var(--rows),var(--tile));gap:var(--gap)}
    .row{display:grid;grid-template-columns:repeat(5,var(--tile));gap:var(--gap)}
    .tile{width:var(--tile);height:var(--tile);display:grid;place-items:center;background:var(--empty);border:var(--border) solid var(--ink);border-radius:0;font-weight:1000;font-size:clamp(19px,5.4vw,34px);text-transform:uppercase;line-height:1;user-select:none;transition:transform .08s ease,background .12s ease,color .12s ease;box-shadow:2px 2px 0 var(--ink)}
    .tile.filled{background:var(--filled)}.tile.pop{transform:scale(1.06)}
    .tile.absent{background:var(--absent);color:#fff}.tile.present{background:var(--present);color:var(--ink)}.tile.correct{background:var(--correct);color:#fff}
    .tile.shake{animation:shake .28s linear}.tile.reveal{animation:flip .28s ease both}
    @keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
    @keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
    .keyboard{width:min(720px,100%);display:grid;gap:6px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
    .krow{display:flex;gap:5px;justify-content:center}.key{min-width:0;height:48px;flex:1;border:var(--border) solid var(--ink);border-radius:0;background:var(--key);color:var(--ink);display:grid;place-items:center;font-weight:1000;text-transform:uppercase;box-shadow:3px 3px 0 var(--ink);padding:0;font-size:15px}
    .key.big{flex:1.7;font-size:11px;background:#c4d5ec}.key.absent{background:var(--absent);color:#fff}.key.present{background:var(--present);color:var(--ink)}.key.correct{background:var(--correct);color:#fff}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}
    .box{width:min(520px,100%);background:var(--panel);border:var(--border) solid var(--ink);border-radius:0;padding:18px;box-shadow:8px 8px 0 var(--ink)}
    .box h2{margin:0 0 8px;font-size:28px;text-transform:uppercase;letter-spacing:-.04em}.answers{display:grid;gap:8px;margin:14px 0}.answer{background:#fff;border:2px solid var(--ink);border-radius:0;padding:10px 12px;font-weight:1000;display:flex;justify-content:space-between;gap:10px}.answer span:last-child{color:var(--muted)}
    .help{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:14px;color:var(--ink);line-height:1.35;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1}
    .toast{position:fixed;top:calc(76px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);padding:11px 16px;border:var(--border) solid var(--ink);border-radius:0;font-weight:1000;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .15s ease;z-index:20;white-space:nowrap}.toast.show{opacity:1}
    @media (max-width:980px){.boards-wrap.mode-4{grid-template-columns:repeat(2,min-content)}}
    @media (max-width:560px){
      .app{padding-left:6px;padding-right:6px;gap:6px}
      header{padding:6px;box-shadow:3px 3px 0 var(--ink)}
      .top-actions{gap:5px}button,select{font-size:11px;padding:7px 8px;min-height:36px;box-shadow:2px 2px 0 var(--ink)}
      .boards-wrap{gap:6px}.board-card{padding:5px;box-shadow:3px 3px 0 var(--ink)}
      .boards-wrap.mode-2,.boards-wrap.mode-4{grid-template-columns:repeat(2,min-content)}
      .keyboard{gap:5px}.key{height:44px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}.key.big{font-size:10px}.krow{gap:4px}
    }
    @media (max-width:390px){
      :root{--tile:clamp(29px,7.9vw,34px);--gap:3px;--border:2px;--shadow:3px 3px 0 var(--ink)}
      h1{font-size:clamp(28px,8vw,34px)}.board-title{height:14px;font-size:8px}.status{font-size:12px;min-height:24px}
      .board-card{padding:4px}.key{height:41px;font-size:12px}.key.big{font-size:9px}.top-actions button,.top-actions select{padding:6px 7px}
    }
    @media (max-height:720px) and (max-width:430px){.key{height:38px}.status{min-height:22px}.app{gap:5px}.boards-wrap{gap:5px}.board-card{padding:4px}.board-title{height:13px}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div></div>
      <h1>Faetermo</h1>
      <div class="top-actions">
        <select id="mode" title="Modo de jogo">
          <option value="1">1 palavra</option>
          <option value="2">2 palavras</option>
          <option value="4">4 palavras</option>
        </select>
        <button id="helpBtn">?</button>
        <button id="newBtn" class="primary">Novo</button>
      </div>
    </header>
    <main>
      <div class="status" id="status">Faetermo: descubra a palavra de 5 letras.</div>
      <section id="boards" class="boards-wrap mode-1"></section>
      <section class="keyboard" id="keyboard"></section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <div class="box">
      <h2 id="modalTitle">Resultado</h2>
      <p class="help" id="modalText"></p>
      <div class="answers" id="answers"></div>
      <div class="actions">
        <button id="again" class="primary">Jogar novas palavras</button>
        <button id="close">Fechar</button>
      </div>
    </div>
  </div>

a filme video radio telas preto verde rosas prata cesta lutar tenis surfe remar canto baile ritmo poema palco tecla mouse dados senha email redes netos sogra sogro noras viuva viuvo geada raios brisa nevoa serra vales costa ilhas lagos norte leste atomo fruto bolos torta sucos matar ouvir fugir durar girar cavar regar linda medio ativo unico total livre local geral legal igual final ombro peito barba unhas bolsa moeda carta fotos vidro metal ferro trens barco aviao metro navio motos pneus freio rodas motor lapis regua aluno casas salas telha cerca forno banho medos raiva calma graca duzia saude texto horas coisa mundo tempo grupo nivel favor valor ordem`.split(/\s+/).map(w=>normalize(w)).filter(w=>w.length===5);
  // Termos de tecnologia/desenvolvimento: aceitos como tentativa, mas nunca sorteados como resposta (jargao tecnico demais para ser a palavra do dia).
  const TECH_TERMS = `debug cache stack bytes disco virus modem termo fonte pixel linux swift react sinal botao icone menus login robos drone codec rotas merge clone index query vetor loops hacks teste falha erros bases macro layer proxy token frame shell patch blogs sites links array codar`.split(/\s+/).map(w=>normalize(w)).filter(w=>w.length===5);
  // Banco de respostas nivel iniciante: EXCLUSIVAMENTE estes 150 termos de tecnologia/computacao sao sorteados como palavra secreta.
  // Acentos sao removidos em tempo de execucao pela funcao normalize() (ex.: VIDEO, AUDIO, ROBOS, BOTAO, ICONE, SAIDA, MIDIA, MOVEL, ECRAS, SUITE, FORUM, NIVEL, RADIO, VIRUS, COPIA).
  const WORDS = `email mouse dados tecla redes cabos drive chips bytes pixel telas video audio robos laser radar sinal senha links icone disco cache modem rotas nuvem login cloud menus fonte botao chave canal virus falha erros teste banco token codec sites blogs feeds posts chats games nerds fibra placa logos fotos radio pasta setas enter shift abrir fecha copia colar corta edita criar baixa envia clica toque conta porta saida entra texto lista filme drone vlogs hacks spams likes users admin debug mapas cifra rolar salva midia sonar ciber patch reset subir curte segue grupo lives linux macos campo linha movel local loops array class stack filas index query print layer frame zooms swipe ecras ratos fones carga pilha volts hertz gigas megas ondas modos barra guias apaga busca nanos infra suite crash trava lento atual grava mover limpa ligar pausa volta forum anexo banir mutar ativa emoji reels skins nivel`.split(/\s+/).map(w=>normalize(w)).filter(w=>w.length===5);
  const VALID = new Set([...DICTIONARY, ...TECH_TERMS, ...WORDS]);
  const state = { mode:1, rows:6, row:0, col:0, guess:'', answers:[], done:false, solved:[], guesses:[] };
  const $ = s => document.querySelector(s);
  const boardsEl = $('#boards'), keyboardEl = $('#keyboard'), toastEl = $('#toast');
  function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ç/g,'c').replace(/[^a-z]/g,'');}
  function pick(n){ const pool=[...new Set(WORDS)]; for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]} return pool.slice(0,n); }
  function rowsFor(mode){ return mode===1 ? 6 : mode===2 ? 7 : 9; }
  function start(mode=state.mode){ state.mode=Number(mode); state.rows=rowsFor(state.mode); state.row=0; state.col=0; state.guess=''; state.done=false; state.answers=pick(state.mode); state.solved=Array(state.mode).fill(false); state.guesses=[]; $('#mode').value=String(state.mode); renderBoards(); renderKeyboard(); setStatus(state.mode===1?'Faetermo: descubra a palavra de 5 letras.':`Faetermo: descubra ${state.mode} palavras ao mesmo tempo.`); hideModal(); }
  function renderBoards(){ boardsEl.className=`boards-wrap mode-${state.mode}`; boardsEl.innerHTML=''; boardsEl.style.setProperty('--rows',state.rows); for(let b=0;b<state.mode;b++){ const card=document.createElement('div'); card.className='board-card'; card.innerHTML=`<div class="board-title">Palavra ${b+1}</div><div class="board" data-board="${b}"></div>`; const board=card.querySelector('.board'); board.style.setProperty('--rows',state.rows); for(let r=0;r<state.rows;r++){ const row=document.createElement('div'); row.className='row'; for(let c=0;c<5;c++){ const tile=document.createElement('div'); tile.className='tile'; tile.dataset.r=r; tile.dataset.c=c; tile.dataset.b=b; row.appendChild(tile);} board.appendChild(row);} boardsEl.appendChild(card);} }
  function renderKeyboard(){ const rows=['qwertyuiop','asdfghjkl','zxcvbnm']; keyboardEl.innerHTML=''; rows.forEach((letters,i)=>{ const row=document.createElement('div'); row.className='krow'; if(i===2) row.appendChild(key('enter','ENTER','big')); [...letters].forEach(ch=>row.appendChild(key(ch,ch))); if(i===2) row.appendChild(key('back','⌫','big')); keyboardEl.appendChild(row); }); }
  function key(code,label,cls=''){ const el=document.createElement('button'); el.className=`key ${cls}`; el.textContent=label; el.dataset.key=code; el.addEventListener('click',()=>handle(code)); return el; }
  function setStatus(t){ $('#status').textContent=t; }
  function toast(t){ toastEl.textContent=t; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'),1200); }
  function handle(k){ if(state.done) return; if(k==='enter') return submit(); if(k==='back') return backspace(); if(/^[a-z]$/.test(k)) add(k); }
  function add(ch){ if(state.col>=5) return; state.guess+=ch; state.col++; document.querySelectorAll(`.tile[data-r="${state.row}"][data-c="${state.col-1}"]`).forEach(t=>{t.textContent=ch;t.classList.add('filled','pop');setTimeout(()=>t.classList.remove('pop'),90)}); }
  function backspace(){ if(state.col<=0) return; state.col--; state.guess=state.guess.slice(0,-1); document.querySelectorAll(`.tile[data-r="${state.row}"][data-c="${state.col}"]`).forEach(t=>{t.textContent='';t.className='tile'}); }
  function submit(){ const g=normalize(state.guess); if(g.length<5){shake();return toast('Digite 5 letras.')} if(!VALID.has(g)){shake();return toast('Palavra não reconhecida.')} state.guesses.push(g); reveal(g); state.row++; state.col=0; state.guess=''; if(state.solved.every(Boolean)){ state.done=true; setTimeout(()=>finish(true),900); return; } if(state.row>=state.rows){ state.done=true; setTimeout(()=>finish(false),900); return; } setStatus(`${state.rows-state.row} tentativa${state.rows-state.row===1?'':'s'} restante${state.rows-state.row===1?'':'s'}.`); }
  function shake(){ document.querySelectorAll(`.tile[data-r="${state.row}"]`).forEach(t=>{t.classList.add('shake');setTimeout(()=>t.classList.remove('shake'),300)}); }
  function score(guess,answer){ const out=Array(5).fill('absent'), used=Array(5).fill(false); for(let i=0;i<5;i++) if(guess[i]===answer[i]){out[i]='correct';used[i]=true;} for(let i=0;i<5;i++){ if(out[i]==='correct') continue; for(let j=0;j<5;j++) if(!used[j] && guess[i]===answer[j]){out[i]='present';used[j]=true;break;} } return out; }
  function reveal(g){ const keyRank={absent:1,present:2,correct:3}; const revealRow=state.row; for(let b=0;b<state.mode;b++){ if(state.solved[b]) continue; const res=score(g,state.answers[b]); if(g===state.answers[b]) state.solved[b]=true; res.forEach((kind,c)=>setTimeout(()=>{ const t=document.querySelector(`.tile[data-b="${b}"][data-r="${revealRow}"][data-c="${c}"]`); if(!t) return; t.classList.add('reveal'); t.classList.remove('filled'); t.classList.add(kind); const k=document.querySelector(`.key[data-key="${g[c]}"]`); if(k){ const cur=['absent','present','correct'].find(x=>k.classList.contains(x)); if(!cur || keyRank[kind]>keyRank[cur]){k.classList.remove('absent','present','correct');k.classList.add(kind);} } },c*95)); }
  }
  function finish(win){ $('#modalTitle').textContent = win ? 'Você venceu!' : 'Fim de jogo'; $('#modalText').textContent = win ? `Resolvido em ${state.row} tentativa${state.row===1?'':'s'}.` : 'As palavras eram:'; const a=$('#answers'); a.innerHTML=''; state.answers.forEach((w,i)=>{ const div=document.createElement('div'); div.className='answer'; div.innerHTML=`<strong>${w.toUpperCase()}</strong><span>${state.solved[i]?'resolvida':'não resolvida'}</span>`; a.appendChild(div); }); showModal(); }
  function showModal(){ $('#modal').classList.add('show'); } function hideModal(){ $('#modal').classList.remove('show'); }
  $('#newBtn').addEventListener('click',()=>start()); $('#again').addEventListener('click',()=>start()); $('#close').addEventListener('click',hideModal); $('#mode').addEventListener('change',e=>start(e.target.value));
  $('#helpBtn').addEventListener('click',()=>{ $('#modalTitle').textContent='Como jogar Faetermo'; $('#modalText').textContent='Digite uma palavra de 5 letras. Verde indica letra certa no lugar certo; amarelo indica letra presente em outro lugar; cinza indica letra ausente. Nos modos de 2 e 4 palavras, cada tentativa vale para todos os tabuleiros. O dicionário foi refeito para PT-BR: palavras de 5 letras aceitas como tentativa e como respostas comuns, sem nomes próprios e estrangeirismos óbvios.'; $('#answers').innerHTML='<div class="answer"><strong>NOVO</strong><span>reinicia na hora</span></div>'; showModal(); });
  window.addEventListener('keydown',e=>{ const k=e.key.toLowerCase(); if(k==='enter'||k==='backspace'||/^[a-zA-Z]$/.test(e.key)){ e.preventDefault(); handle(k==='backspace'?'back':k); }});
  start(1);
})();
</script>
